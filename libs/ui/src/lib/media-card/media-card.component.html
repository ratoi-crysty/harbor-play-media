<a class="media-link" [routerLink]="selectable() ? null : ['/player', media().id]">
  <article
    class="media-card"
    [class.selectable]="selectable()"
    [class.selected]="selected()"
    tabindex="0"
    role="button"
    [attr.aria-label]="media().title"
  >
    <div class="thumbnail-wrap">
      <img [src]="media().thumbnailUrl" [alt]="media().title" class="thumbnail" loading="lazy" />
      <span class="duration-badge">{{ duration() }}</span>
      @if (selectable()) {
        <div class="select-overlay" tabindex="0" role="checkbox" [attr.aria-checked]="selected()" (click)="onCheckboxClick($event)" (keydown.enter)="onCheckboxClick($event)" (keydown.space)="onCheckboxClick($event)">
          <mat-checkbox
            [checked]="selected()"
            color="primary"
          />
        </div>
      } @else {
        <div class="play-overlay">
          <mat-icon>play_circle_outline</mat-icon>
        </div>
      }
    </div>
    <div class="card-body">
      <p class="card-title">{{ media().title }}</p>
      @if (media().resolution) {
        <span class="resolution-badge">{{ media().resolution }}</span>
      }
    </div>
  </article>
</a>
