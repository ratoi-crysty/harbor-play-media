<a class="collection-link" [routerLink]="['/collections', collection().id]">
  <article class="collection-card" tabindex="0" role="button" [attr.aria-label]="collection().name">
    <div class="thumbnail-wrap">
      @if (hasThumbnail()) {
        <img [src]="collection().thumbnailUrl" [alt]="collection().name" class="thumbnail" loading="lazy" />
      }
      <div class="folder-overlay">
        <mat-icon class="folder-icon">folder</mat-icon>
      </div>
      <span class="item-badge">{{ itemLabel() }}</span>
    </div>
    <div class="card-body">
      <p class="card-title">{{ collection().name }}</p>
      <button
        mat-icon-button
        class="card-menu-btn"
        [matMenuTriggerFor]="cardMenu"
        (click)="onMenuClick($event)"
        aria-label="Collection options"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>

    <mat-menu #cardMenu="matMenu">
      <button mat-menu-item (click)="renamed.emit()">
        <mat-icon>edit</mat-icon>
        <span>Rename</span>
      </button>
      <button mat-menu-item (click)="moved.emit()">
        <mat-icon>drive_file_move</mat-icon>
        <span>Move</span>
      </button>
      <button mat-menu-item class="delete-item" (click)="deleted.emit()">
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
      </button>
    </mat-menu>
  </article>
</a>
